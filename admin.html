<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .order-card {
            transition: all 0.3s;
            margin-bottom: 15px;
        }
        .order-card:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .accepted {
            border-left: 5px solid #28a745;
        }
        .rejected {
            border-left: 5px solid #dc3545;
        }
        .pending {
            border-left: 5px solid #ffc107;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 bg-dark text-white min-vh-100 p-4">
                <h2 class="text-center mb-4">Admin Panel</h2>
                <div class="mb-4">
                    <h5>Admin Controls</h5>
                    <button class="btn btn-outline-light w-100 mb-2" onclick="loadAllOrders()">All Orders</button>
                    <button class="btn btn-outline-success w-100 mb-2" onclick="loadOrdersByStatus('accepted')">Accepted Orders</button>
                    <button class="btn btn-outline-danger w-100 mb-2" onclick="loadOrdersByStatus('rejected')">Rejected Orders</button>
                    <button class="btn btn-outline-warning w-100 mb-2" onclick="loadOrdersByStatus('pending')">Pending Orders</button>
                </div>
                <div class="mt-5">
                    <button id="logout-btn" class="btn btn-danger w-100">Logout</button>
                </div>
            </div>
            <div class="col-md-9 p-4">
                <h3 id="section-title">All Orders</h3>
                <div id="orders-container" class="row">
                    <!-- Orders will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Admin panel functionality
        document.addEventListener('DOMContentLoaded', function() {
            // Logout functionality
            document.getElementById('logout-btn').addEventListener('click', function() {
                if (confirm('Are you sure you want to logout?')) {
                    // Clear authentication data
                    localStorage.removeItem('adminToken');
                    sessionStorage.removeItem('adminToken');
                    
                    // Clear cookies (if used)
                    document.cookie = 'adminToken=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
                    
                    // Redirect to login page
                    window.location.href = 'login.html';
                }
            });
            
            // Initial load of orders
            loadAllOrders();
        });

        function loadAllOrders() {
            document.getElementById('section-title').textContent = 'All Orders';
            // Fetch and display all orders
            fetchOrders(null);
        }

        function loadOrdersByStatus(status) {
            const statusTitles = {
                'accepted': 'Accepted Orders',
                'rejected': 'Rejected Orders',
                'pending': 'Pending Orders'
            };
            document.getElementById('section-title').textContent = statusTitles[status];
            // Fetch and display orders by status
            fetchOrders(status);
        }

        function fetchOrders(status) {
            // This would be your actual API call to get orders
            console.log(`Fetching orders with status: ${status || 'all'}`);
            // Implement your actual fetch logic here
            // Example:
            /*
            fetch(`/api/orders${status ? '?status=' + status : ''}`)
                .then(response => response.json())
                .then(data => displayOrders(data))
                .catch(error => console.error('Error:', error));
            */
        }

        function displayOrders(orders) {
            const container = document.getElementById('orders-container');
            container.innerHTML = '';
            // Implement your order display logic here
        }
    </script>
</body>
</html>
