<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .order-card {
            transition: all 0.3s;
            margin-bottom: 15px;
        }
        .order-card:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .accepted {
            border-left: 5px solid #28a745;
        }
        .rejected {
            border-left: 5px solid #dc3545;
        }
        .pending {
            border-left: 5px solid #ffc107;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 bg-dark text-white min-vh-100 p-4">
                <h2 class="text-center mb-4">Admin Panel</h2>
                <div class="mb-4">
                    <h5>Admin Controls</h5>
                    <button class="btn btn-outline-light w-100 mb-2" onclick="loadAllOrders()">All Orders</button>
                    <button class="btn btn-outline-success w-100 mb-2" onclick="loadOrdersByStatus('accepted')">Accepted Orders</button>
                    <button class="btn btn-outline-danger w-100 mb-2" onclick="loadOrdersByStatus('rejected')">Rejected Orders</button>
                    <button class="btn btn-outline-warning w-100 mb-2" onclick="loadOrdersByStatus('pending')">Pending Orders</button>
                </div>
                <div class="mt-5">
                    <button class="btn btn-danger w-100" onclick="logout()">Logout</button>
                </div>
            </div>
            <div class="col-md-9 p-4">
                <h3 id="section-title">All Orders</h3>
                <div id="orders-container" class="row">
                    <!-- Orders will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // admin.js

function logout() {
    // Here you would typically:
    // 1. Clear any admin authentication tokens from localStorage/sessionStorage
    // 2. Redirect to the login page
    
    // Clear admin authentication data
    localStorage.removeItem('adminToken');
    sessionStorage.removeItem('adminToken');
    
    // Redirect to login page
    window.location.href = 'login.html'; // Change this to your actual login page URL
}

// Other existing functions...
function loadAllOrders() {
    // Your existing code
}

function loadOrdersByStatus(status) {
    // Your existing code
}

// You might also want to add an event listener for the logout button
document.addEventListener('DOMContentLoaded', function() {
    // This ensures the DOM is fully loaded before attaching event listeners
    
    // If you prefer to use event listeners instead of inline onclick
    const logoutBtn = document.querySelector('.btn-danger');
    if (logoutBtn) {
        logoutBtn.addEventListener('click', logout);
    }
});
    </script>
    <script src="admin.js"></script>
</body>
</html>
