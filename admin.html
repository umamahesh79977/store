<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .order-card {
            transition: all 0.3s;
            margin-bottom: 15px;
        }
        .order-card:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .accepted {
            border-left: 5px solid #28a745;
        }
        .rejected {
            border-left: 5px solid #dc3545;
        }
        .pending {
            border-left: 5px solid #ffc107;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 bg-dark text-white min-vh-100 p-4">
                <h2 class="text-center mb-4">Admin Panel</h2>
                <div class="mb-4">
                    <h5>Admin Controls</h5>
                    <button class="btn btn-outline-light w-100 mb-2" id="all-orders-btn">All Orders</button>
                    <button class="btn btn-outline-success w-100 mb-2" id="accepted-orders-btn">Accepted Orders</button>
                    <button class="btn btn-outline-danger w-100 mb-2" id="rejected-orders-btn">Rejected Orders</button>
                    <button class="btn btn-outline-warning w-100 mb-2" id="pending-orders-btn">Pending Orders</button>
                </div>
                <div class="mt-5">
                    <button id="logout-btn" class="btn btn-danger w-100">Logout</button>
                </div>
            </div>
            <div class="col-md-9 p-4">
                <h3 id="section-title">All Orders</h3>
                <div id="orders-container" class="row">
                    <!-- Orders will be loaded here -->
                    <div class="col-12">
                        <div class="alert alert-info">No orders found. Orders will appear here.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Debugging function to check authentication status
        function checkAuth() {
            console.log('Current authentication status:');
            console.log('LocalStorage token:', localStorage.getItem('adminToken'));
            console.log('SessionStorage token:', sessionStorage.getItem('adminToken'));
            console.log('Cookies:', document.cookie);
        }

        // Enhanced logout function
        function logout() {
            console.log('Attempting to logout...');
            checkAuth(); // Debug current auth state
            
            try {
                // Clear all authentication data
                localStorage.removeItem('adminToken');
                sessionStorage.removeItem('adminToken');
                
                // Clear cookies more thoroughly
                document.cookie = 'adminToken=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=' + window.location.hostname + ';';
                document.cookie = 'sessionId=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=' + window.location.hostname + ';';
                
                console.log('Authentication data cleared. Redirecting...');
                checkAuth(); // Verify clearance
                
                // Redirect to login page
                window.location.href = 'login.html';
                
                // Fallback in case redirect fails
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1000);
            } catch (error) {
                console.error('Logout error:', error);
                alert('Logout failed. Please try again or clear browser data manually.');
            }
        }

        // Order management functions (simplified for demo)
        function loadAllOrders() {
            console.log('Loading all orders...');
            document.getElementById('section-title').textContent = 'All Orders';
            // Simulate API call
            setTimeout(() => {
                document.getElementById('orders-container').innerHTML = `
                    <div class="col-md-6">
                        <div class="card order-card">
                            <div class="card-body">
                                <h5 class="card-title">Order #1001</h5>
                                <p class="card-text">Status: Pending</p>
                            </div>
                        </div>
                    </div>
                `;
            }, 500);
        }

        function loadOrdersByStatus(status) {
            console.log(`Loading ${status} orders...`);
            const statusMap = {
                'accepted': 'Accepted Orders',
                'rejected': 'Rejected Orders', 
                'pending': 'Pending Orders'
            };
            document.getElementById('section-title').textContent = statusMap[status];
            // Simulate API call
            setTimeout(() => {
                document.getElementById('orders-container').innerHTML = `
                    <div class="col-md-6">
                        <div class="card order-card ${status}">
                            <div class="card-body">
                                <h5 class="card-title">Order #${Math.floor(Math.random()*9000)+1000}</h5>
                                <p class="card-text">Status: ${status.charAt(0).toUpperCase() + status.slice(1)}</p>
                            </div>
                        </div>
                    </div>
                `;
            }, 500);
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Admin panel loaded');
            checkAuth();
            
            // Button event listeners
            document.getElementById('logout-btn').addEventListener('click', function(e) {
                e.preventDefault();
                if (confirm('Are you sure you want to logout?')) {
                    logout();
                }
            });
            
            document.getElementById('all-orders-btn').addEventListener('click', loadAllOrders);
            document.getElementById('accepted-orders-btn').addEventListener('click', () => loadOrdersByStatus('accepted'));
            document.getElementById('rejected-orders-btn').addEventListener('click', () => loadOrdersByStatus('rejected'));
            document.getElementById('pending-orders-btn').addEventListener('click', () => loadOrdersByStatus('pending'));
            
            // Load initial data
            loadAllOrders();
        });

        // Error handling
        window.addEventListener('error', function(e) {
            console.error('Unhandled error:', e.error);
            alert('An error occurred. Please check console for details.');
        });
    </script>
</body>
</html>
