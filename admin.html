<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .order-card {
            transition: all 0.3s;
            margin-bottom: 15px;
        }
        .order-card:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .accepted {
            border-left: 5px solid #28a745;
            background-color: rgba(40, 167, 69, 0.05);
        }
        .rejected {
            border-left: 5px solid #dc3545;
            background-color: rgba(220, 53, 69, 0.05);
        }
        .pending {
            border-left: 5px solid #ffc107;
            background-color: rgba(255, 193, 7, 0.05);
        }
        .status-badge {
            font-size: 0.9rem;
            padding: 5px 10px;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 bg-dark text-white min-vh-100 p-4">
                <h2 class="text-center mb-4">Admin Panel</h2>
                <div class="mb-4">
                    <h5>Admin Controls</h5>
                    <button class="btn btn-outline-light w-100 mb-2" id="all-orders-btn">All Orders</button>
                    <button class="btn btn-outline-success w-100 mb-2" id="accepted-orders-btn">Accepted Orders</button>
                    <button class="btn btn-outline-danger w-100 mb-2" id="rejected-orders-btn">Rejected Orders</button>
                    <button class="btn btn-outline-warning w-100 mb-2" id="pending-orders-btn">Pending Orders</button>
                </div>
                <div class="mt-5">
                    <button id="logout-btn" class="btn btn-danger w-100">Logout</button>
                </div>
            </div>
            <div class="col-md-9 p-4">
                <h3 id="section-title">All Orders</h3>
                <div id="orders-container" class="row">
                    <!-- Orders will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Initialize sample data if localStorage is empty
        function initializeData() {
            if (!localStorage.getItem('orders')) {
                const sampleOrders = [
                    {
                        id: 1001,
                        customer: "John Doe",
                        items: ["Product A", "Product B"],
                        total: 125.99,
                        status: "pending",
                        date: new Date().toISOString().split('T')[0]
                    },
                    {
                        id: 1002,
                        customer: "Jane Smith",
                        items: ["Product C"],
                        total: 59.99,
                        status: "pending",
                        date: new Date(Date.now() - 86400000).toISOString().split('T')[0]
                    },
                    {
                        id: 1003,
                        customer: "Bob Johnson",
                        items: ["Product A", "Product D"],
                        total: 89.50,
                        status: "pending",
                        date: new Date(Date.now() - 172800000).toISOString().split('T')[0]
                    }
                ];
                localStorage.setItem('orders', JSON.stringify(sampleOrders));
                console.log('Initialized sample orders data');
            }
        }

        // Get all orders from localStorage
        function getOrders() {
            const orders = localStorage.getItem('orders');
            return orders ? JSON.parse(orders) : [];
        }

        // Update order status and refresh display
        function updateOrderStatus(orderId, newStatus) {
            const orders = getOrders();
            const orderIndex = orders.findIndex(order => order.id === orderId);
            
            if (orderIndex !== -1) {
                orders[orderIndex].status = newStatus;
                localStorage.setItem('orders', JSON.stringify(orders));
                refreshOrderDisplay();
                showStatusAlert(`Order #${orderId} marked as ${newStatus}`, newStatus);
            }
        }

        // Refresh the order display based on current filter
        function refreshOrderDisplay() {
            const currentFilter = document.getElementById('section-title').textContent;
            
            if (currentFilter === 'All Orders') {
                loadAllOrders();
            } else if (currentFilter === 'Pending Orders') {
                loadOrdersByStatus('pending');
            } else if (currentFilter === 'Accepted Orders') {
                loadOrdersByStatus('accepted');
            } else if (currentFilter === 'Rejected Orders') {
                loadOrdersByStatus('rejected');
            }
        }

        // Show status change alert
        function showStatusAlert(message, status) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${status === 'accepted' ? 'success' : 'danger'} alert-dismissible fade show`;
            alertDiv.role = 'alert';
            alertDiv.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            `;
            
            const container = document.getElementById('orders-container');
            container.parentNode.insertBefore(alertDiv, container);
            
            setTimeout(() => {
                alertDiv.classList.remove('show');
                setTimeout(() => alertDiv.remove(), 150);
            }, 3000);
        }

        // Display orders in the UI
        function displayOrders(orders) {
            const container = document.getElementById('orders-container');
            
            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="col-12">
                        <div class="alert alert-info">No orders found matching the current filter.</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = orders.map(order => `
                <div class="col-md-6 col-lg-4 mb-4">
                    <div class="card order-card ${order.status} h-100">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">Order #${order.id}</h5>
                            <p class="card-text"><strong>Customer:</strong> ${order.customer}</p>
                            <p class="card-text"><strong>Items:</strong> ${order.items.join(', ')}</p>
                            <p class="card-text"><strong>Total:</strong> $${order.total.toFixed(2)}</p>
                            <p class="card-text"><strong>Status:</strong> 
                                <span class="badge rounded-pill ${getStatusBadgeClass(order.status)}">
                                    ${order.status.charAt(0).toUpperCase() + order.status.slice(1)}
                                </span>
                            </p>
                            <p class="card-text"><small class="text-muted">Date: ${order.date}</small></p>
                            
                            ${order.status === 'pending' ? `
                            <div class="action-buttons mt-auto">
                                <button class="btn btn-success btn-sm" 
                                    onclick="updateOrderStatus(${order.id}, 'accepted')">
                                    Accept Order
                                </button>
                                <button class="btn btn-danger btn-sm" 
                                    onclick="updateOrderStatus(${order.id}, 'rejected')">
                                    Reject Order
                                </button>
                            </div>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Helper function for status badge classes
        function getStatusBadgeClass(status) {
            const classes = {
                'accepted': 'bg-success',
                'rejected': 'bg-danger',
                'pending': 'bg-warning text-dark'
            };
            return classes[status] || 'bg-secondary';
        }

        // Filter orders by status
        function loadOrdersByStatus(status) {
            const statusTitles = {
                'accepted': 'Accepted Orders',
                'rejected': 'Rejected Orders', 
                'pending': 'Pending Orders'
            };
            document.getElementById('section-title').textContent = statusTitles[status];
            
            const orders = getOrders();
            const filteredOrders = status === 'all' ? orders : orders.filter(order => order.status === status);
            displayOrders(filteredOrders);
        }

        // Load all orders
        function loadAllOrders() {
            document.getElementById('section-title').textContent = 'All Orders';
            const orders = getOrders();
            displayOrders(orders);
        }

        // Logout function
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('adminToken');
                window.location.href = 'login.html';
            }
        }

        // Initialize the admin panel
        document.addEventListener('DOMContentLoaded', function() {
            initializeData();
            
            // Set up event listeners
            document.getElementById('logout-btn').addEventListener('click', logout);
            document.getElementById('all-orders-btn').addEventListener('click', loadAllOrders);
            document.getElementById('accepted-orders-btn').addEventListener('click', () => loadOrdersByStatus('accepted'));
            document.getElementById('rejected-orders-btn').addEventListener('click', () => loadOrdersByStatus('rejected'));
            document.getElementById('pending-orders-btn').addEventListener('click', () => loadOrdersByStatus('pending'));
            
            // Load initial data
            loadAllOrders();
        });
    </script>
</body>
</html>
