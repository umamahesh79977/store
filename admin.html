<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .order-card {
            transition: all 0.3s;
            margin-bottom: 15px;
        }
        .order-card:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .accepted {
            border-left: 5px solid #28a745;
            background-color: rgba(40, 167, 69, 0.05);
        }
        .rejected {
            border-left: 5px solid #dc3545;
            background-color: rgba(220, 53, 69, 0.05);
        }
        .pending {
            border-left: 5px solid #ffc107;
            background-color: rgba(255, 193, 7, 0.05);
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 bg-dark text-white min-vh-100 p-4">
                <h2 class="text-center mb-4">Admin Panel</h2>
                <div class="mb-4">
                    <h5>Admin Controls</h5>
                    <button class="btn btn-outline-light w-100 mb-2" id="all-orders-btn">All Orders</button>
                    <button class="btn btn-outline-success w-100 mb-2" id="accepted-orders-btn">Accepted Orders</button>
                    <button class="btn btn-outline-danger w-100 mb-2" id="rejected-orders-btn">Rejected Orders</button>
                    <button class="btn btn-outline-warning w-100 mb-2" id="pending-orders-btn">Pending Orders</button>
                </div>
                <div class="mt-5">
                    <button id="logout-btn" class="btn btn-danger w-100">Logout</button>
                </div>
            </div>
            <div class="col-md-9 p-4">
                <h3 id="section-title">All Orders</h3>
                <div id="orders-container" class="row">
                    <!-- Orders will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Sample data structure to store in localStorage
        const sampleOrders = [
            {
                id: 1001,
                customer: "John Doe",
                items: ["Product A", "Product B"],
                total: 125.99,
                status: "pending",
                date: "2023-05-15"
            },
            {
                id: 1002,
                customer: "Jane Smith",
                items: ["Product C"],
                total: 59.99,
                status: "accepted",
                date: "2023-05-14"
            },
            {
                id: 1003,
                customer: "Bob Johnson",
                items: ["Product A", "Product D"],
                total: 89.50,
                status: "rejected",
                date: "2023-05-13"
            }
        ];

        // Initialize localStorage with sample data if empty
        function initializeData() {
            if (!localStorage.getItem('orders')) {
                localStorage.setItem('orders', JSON.stringify(sampleOrders));
                console.log('Sample orders data initialized in localStorage');
            }
        }

        // Get orders from localStorage
        function getOrders() {
            const orders = localStorage.getItem('orders');
            return orders ? JSON.parse(orders) : [];
        }

        // Display orders in the admin panel
        function displayOrders(orders) {
            const container = document.getElementById('orders-container');
            
            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="col-12">
                        <div class="alert alert-info">No orders found.</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = orders.map(order => `
                <div class="col-md-6 col-lg-4">
                    <div class="card order-card ${order.status}">
                        <div class="card-body">
                            <h5 class="card-title">Order #${order.id}</h5>
                            <p class="card-text"><strong>Customer:</strong> ${order.customer}</p>
                            <p class="card-text"><strong>Items:</strong> ${order.items.join(', ')}</p>
                            <p class="card-text"><strong>Total:</strong> $${order.total.toFixed(2)}</p>
                            <p class="card-text"><strong>Status:</strong> 
                                <span class="badge ${getStatusBadgeClass(order.status)}">
                                    ${order.status.charAt(0).toUpperCase() + order.status.slice(1)}
                                </span>
                            </p>
                            <p class="card-text"><small class="text-muted">${order.date}</small></p>
                            <div class="d-flex justify-content-between mt-2">
                                <button class="btn btn-sm btn-success" onclick="updateOrderStatus(${order.id}, 'accepted')">
                                    Accept
                                </button>
                                <button class="btn btn-sm btn-danger" onclick="updateOrderStatus(${order.id}, 'rejected')">
                                    Reject
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Helper function for status badge classes
        function getStatusBadgeClass(status) {
            const classes = {
                'accepted': 'bg-success',
                'rejected': 'bg-danger',
                'pending': 'bg-warning text-dark'
            };
            return classes[status] || 'bg-secondary';
        }

        // Update order status in localStorage
        function updateOrderStatus(orderId, newStatus) {
            const orders = getOrders();
            const orderIndex = orders.findIndex(order => order.id === orderId);
            
            if (orderIndex !== -1) {
                orders[orderIndex].status = newStatus;
                localStorage.setItem('orders', JSON.stringify(orders));
                
                // Refresh the displayed orders
                const currentFilter = document.getElementById('section-title').textContent;
                if (currentFilter.includes('All')) {
                    loadAllOrders();
                } else {
                    const status = currentFilter.split(' ')[0].toLowerCase();
                    loadOrdersByStatus(status);
                }
            }
        }

        // Filter orders by status
        function loadOrdersByStatus(status) {
            const statusTitles = {
                'accepted': 'Accepted Orders',
                'rejected': 'Rejected Orders', 
                'pending': 'Pending Orders'
            };
            document.getElementById('section-title').textContent = statusTitles[status];
            
            const orders = getOrders();
            const filteredOrders = orders.filter(order => order.status === status);
            displayOrders(filteredOrders);
        }

        // Load all orders
        function loadAllOrders() {
            document.getElementById('section-title').textContent = 'All Orders';
            const orders = getOrders();
            displayOrders(orders);
        }

        // Logout function
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('adminToken');
                window.location.href = 'login.html';
            }
        }

        // Initialize the admin panel
        document.addEventListener('DOMContentLoaded', function() {
            initializeData();
            
            // Set up event listeners
            document.getElementById('logout-btn').addEventListener('click', logout);
            document.getElementById('all-orders-btn').addEventListener('click', loadAllOrders);
            document.getElementById('accepted-orders-btn').addEventListener('click', () => loadOrdersByStatus('accepted'));
            document.getElementById('rejected-orders-btn').addEventListener('click', () => loadOrdersByStatus('rejected'));
            document.getElementById('pending-orders-btn').addEventListener('click', () => loadOrdersByStatus('pending'));
            
            // Load initial data
            loadAllOrders();
        });
    </script>
</body>
</html>
